name: Build native Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v1.0.0"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        default: false
        type: boolean
      skip_signing:
        description: "Skip Authenticode signing when code-signing secrets are unavailable"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-installer:
    name: Build and publish installer
    runs-on: windows-latest
    env:
      RUNTIME_MANIFEST_PATH: deploy/windows-native/vendor/runtime-manifest.json
      INSTALLER_OUTPUT_DIR: release/installers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.event.inputs.version }}'
          if ([string]::IsNullOrWhiteSpace($version)) { $version = '${{ github.ref_name }}' }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'No se pudo resolver la versión.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_name=Pico de Gallo $version" >> $env:GITHUB_OUTPUT

      - name: Ensure runtime manifest is configured
        shell: pwsh
        env:
          RUNTIME_MANIFEST_JSON: ${{ vars.WINDOWS_RUNTIME_MANIFEST_JSON }}
          RUNTIME_MANIFEST_JSON_SECRET: ${{ secrets.WINDOWS_RUNTIME_MANIFEST_JSON }}
        run: |
          if (-not (Test-Path $env:RUNTIME_MANIFEST_PATH)) {
            $manifestJson = $env:RUNTIME_MANIFEST_JSON
            if ([string]::IsNullOrWhiteSpace($manifestJson)) { $manifestJson = $env:RUNTIME_MANIFEST_JSON_SECRET }
            if ([string]::IsNullOrWhiteSpace($manifestJson)) {
              throw "Falta deploy/windows-native/vendor/runtime-manifest.json o WINDOWS_RUNTIME_MANIFEST_JSON en variables/secrets con URLs HTTPS + SHA256 reales."
            }
            $manifestJson | Set-Content -Path $env:RUNTIME_MANIFEST_PATH -Encoding UTF8
          }
          $text = Get-Content $env:RUNTIME_MANIFEST_PATH -Raw
          if ($text -match 'example\.invalid|replace-with-expected-sha256') {
            throw 'runtime-manifest.json contiene placeholders; configure runtimes versionados y hashes reales antes de publicar.'
          }


      - name: Summarize build plan
        shell: pwsh
        run: |
          $manifest = Get-Content $env:RUNTIME_MANIFEST_PATH -Raw | ConvertFrom-Json
          Write-Host "Version resuelta: ${{ steps.version.outputs.version }}"
          Write-Host "Runtimes esperados:"
          $manifest.runtimes.PSObject.Properties | ForEach-Object { Write-Host "- $($_.Name) $($_.Value.version)" }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            Write-Host "Publicación: workflow_dispatch; se creará/actualizará release con prerelease=${{ github.event.inputs.prerelease }}."
          } else {
            Write-Host "Publicación: tag ${{ github.ref_name }}; se creará/actualizará GitHub Release."
          }
          if ('${{ github.event.inputs.skip_signing }}' -eq 'false') {
            Write-Host 'Firma solicitada; se usará certificado solo si los secrets están configurados.'
          } else {
            Write-Host 'Firma omitida por configuración; puede aparecer advertencia SmartScreen.'
          }

      - name: Fetch and verify Windows runtimes
        shell: pwsh
        run: |
          deploy/windows-native/vendor/fetch-runtimes.ps1 -ManifestPath $env:RUNTIME_MANIFEST_PATH -OutputDir release/runtime-cache

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem deploy/windows-native -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) > $null
            if ($errors.Count -gt 0) { throw "Parse failed: $($_.FullName)" }
            Write-Host "Parsed $($_.Name)"
          }

      - name: Validate service XML templates
        shell: pwsh
        run: |
          Get-ChildItem deploy/windows-native/service-templates/*.xml | ForEach-Object {
            [xml](Get-Content $_.FullName -Raw) > $null
            Write-Host "Parsed $($_.Name)"
          }

      - name: Install frontend dependencies
        working-directory: frontend
        shell: pwsh
        run: npm ci

      - name: Build native release payload
        shell: pwsh
        run: |
          $resolved = Get-Content release/runtime-cache/resolved-runtimes.json -Raw | ConvertFrom-Json
          deploy/windows-native/package-release.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -OutputDir 'release/windows-native' `
            -PythonRuntimePath $resolved.python `
            -PostgresRuntimePath $resolved.postgres `
            -CaddyPath $resolved.caddy `
            -WinSWPath $resolved.winsw

      - name: Validate release payload safety
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem release/windows-native -Recurse -Force -File | Where-Object {
            $_.FullName -match '\\backend\\\.env$' -or
            $_.Name -in @('.env.windows','.env.docker') -or
            $_.FullName -match '\\media\\' -or
            $_.FullName -match '\\dumps\\' -or
            $_.FullName -match '\\backups\\' -or
            $_.FullName -match '\\diagnostics\\' -or
            $_.FullName -match '\\node_modules\\'
          }
          if ($forbidden) { throw "Release contiene archivo prohibido: $($forbidden[0].FullName)" }
          Select-String -Path release/windows-native/manifest.json -Pattern 'DTE_API_TOKEN|DB_PASSWORD|DJANGO_SECRET_KEY' -Quiet | ForEach-Object { if ($_){ throw 'manifest.json contiene nombre de secreto inesperado.' } }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $resolved = Get-Content release/runtime-cache/resolved-runtimes.json -Raw | ConvertFrom-Json
          if (-not $resolved.innoSetup) { throw 'El manifest no resolvió innoSetup.' }
          Start-Process -FilePath $resolved.innoSetup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) { throw 'ISCC.exe no quedó instalado en la ruta esperada.' }

      - name: Prepare code signing certificate
        id: signing
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
        run: |
          $skipInput = '${{ github.event.inputs.skip_signing }}'
          $skip = $true
          if ($skipInput -eq 'false') { $skip = $false }
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) { $skip = $true }
          if ($skip) {
            "skip=true" >> $env:GITHUB_OUTPUT
            Write-Host 'Firma omitida; Windows SmartScreen puede advertir en instaladores no firmados.'
          } else {
            $certPath = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
            "skip=false" >> $env:GITHUB_OUTPUT
            "cert=$certPath" >> $env:GITHUB_OUTPUT
          }

      - name: Build installer
        shell: pwsh
        run: |
          $args = @(
            '-Version', '${{ steps.version.outputs.version }}',
            '-ReleaseDir', 'release/windows-native',
            '-OutputDir', $env:INSTALLER_OUTPUT_DIR,
            '-InnoSetupCompilerPath', 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          )
          if ('${{ steps.signing.outputs.skip }}' -eq 'true') {
            $args += '-SkipSigning'
          } else {
            $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            $args += @('-SignToolPath', $signtool, '-CodeSigningCertPath', '${{ steps.signing.outputs.cert }}', '-CodeSigningTimestampUrl', '${{ secrets.WINDOWS_CODESIGN_TIMESTAMP_URL }}')
          }
          & deploy/windows-native/installer/build-installer.ps1 @args

      - name: Validate installer output
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $exe = Get-ChildItem $env:INSTALLER_OUTPUT_DIR -Filter "PicoDeGallo-Setup-$version*.exe" | Select-Object -First 1
          if (-not $exe) { throw 'No se generó instalador .exe.' }
          $shaPath = "$($exe.FullName).sha256"
          if (-not (Test-Path $shaPath)) { throw 'No se generó .sha256.' }
          $manifest = Join-Path $env:INSTALLER_OUTPUT_DIR "PicoDeGallo-Setup-$version.manifest.json"
          if (-not (Test-Path $manifest)) { throw 'No se generó manifest.json.' }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe.FullName).Hash
          $expected = (Get-Content $shaPath -Raw).Trim()
          if ($actual -ne $expected) { throw 'SHA256 del instalador no coincide.' }
          if (Select-String -Path $manifest -Pattern 'DTE_API_TOKEN|DB_PASSWORD|DJANGO_SECRET_KEY' -Quiet) { throw 'Manifest contiene referencia sensible.' }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PicoDeGallo-Installer-${{ steps.version.outputs.version }}
          path: |
            release/installers/PicoDeGallo-Setup-${{ steps.version.outputs.version }}*.exe
            release/installers/PicoDeGallo-Setup-${{ steps.version.outputs.version }}*.sha256
            release/installers/PicoDeGallo-Setup-${{ steps.version.outputs.version }}.manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Write release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $exe = Get-ChildItem $env:INSTALLER_OUTPUT_DIR -Filter "PicoDeGallo-Setup-$version*.exe" | Select-Object -First 1
          $sha = (Get-Content "$($exe.FullName).sha256" -Raw).Trim()
          @"
          # Pico de Gallo $version

          - Fecha: $(Get-Date -Format o)
          - Commit: $env:GITHUB_SHA
          - SHA256: $sha
          - DTE sigue activo; configure credenciales reales antes de operar fiscalmente.
          - Haga backup antes de actualizar instalaciones existentes.
          - No requiere Docker Desktop.
          - No requiere WSL2.
          - La validación final en VM Windows limpia sigue siendo obligatoria antes de entrega a clientes.
          "@ | Set-Content -Path release-notes.md -Encoding UTF8

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $pre = '${{ github.event.inputs.prerelease }}'
          $args = @('release','create',$version,'--title',"Pico de Gallo $version",'--notes-file','release-notes.md')
          if ($pre -eq 'true') { $args += '--prerelease' }
          gh @args 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host 'Release existente; se actualizarán assets con --clobber.' }
          gh release upload $version `
            "release/installers/PicoDeGallo-Setup-$version.exe" `
            "release/installers/PicoDeGallo-Setup-$version.exe.sha256" `
            "release/installers/PicoDeGallo-Setup-$version.manifest.json#manifest.json" `
            --clobber
